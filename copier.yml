# Configure jinja2 defaults to make syntax highlighters happy
_templates_suffix: .jinja
_subdirectory: src
_envops:
  block_end_string: "%}"
  block_start_string: "{%"
  comment_end_string: "#}"
  comment_start_string: "{#"
  keep_trailing_newline: true
  variable_end_string: "}}"
  variable_start_string: "{{"

package_name:
  type: str
  help: Package Name on pipy

package_description:
  type: str
  help: Project description

github_repo:
  type: str
  help: Name of github repository

python_version:
  type: yaml
  default: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
  help: List of python version to test

author_name:
  type: str
  default: Akretion

author_email:
  type: str
  default: contact@akretion.com

development_status:
  choices:
    - "1 - Planning"
    - "2 - Pre-Alpha"
    - "3 - Alpha"
    - "4 - Beta"
    - "5 - Production/Stable"
    - "6 - Mature"
    - "7 - Inactive"
  default: "5 - Production/Stable"

licence:
  choices:
    - "GNU Affero General Public License v3"
    - "GNU Lesser General Public License v2 or later (LGPLv2+)"
    - "BSD License"
    - "MIT License"
  default: "GNU Affero General Public License v3"

_skip_if_exists:
  - pyproject.toml
  - LICENCE.txt
